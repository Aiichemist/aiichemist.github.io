<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1">
  <meta name="description" content="Aiichemist 的人工智能、数学与计算机科学学习笔记">
  <title>Aiichemist</title>
  <link rel="icon" href="favicon.ico">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4.13.1/lib/themes/vue.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
  <style>
    .page_toc div[class^="lv"] a span { display: inline; }
  </style>
</head>
<body>
  <div id="app">正在加载文档……</div>

  <script>
    window.$docsify = {
      name: '<b>Aiichemist</b>',
      repo: 'https://github.com/Aiichemist/aiichemist.github.io',
      homepage: 'README.md',
      loadSidebar: true,
      auto2top: true,
      mergeNavbar: true,
      maxLevel: 4,
      subMaxLevel: 3,
      topMargin: 90,
      search: {
        placeholder: '搜索文档',
        noData: '没有找到结果',
        depth: 4
      },
      count: {
        countable: true,
        fontsize: '0.9em',
        color: 'rgb(90, 90, 90)',
        language: 'chinese'
      },
      toc: {
        tocMaxLevel: 3,
        target: 'h2, h3, h4, h5, h6'
      },
      'flexible-alerts': {
        note: { label: '说明' },
        tip: { label: '提示' },
        warning: { label: '警告' },
        attention: { label: '注意' }
      }
    };
  </script>

  <script src="https://cdn.jsdelivr.net/npm/docsify@4.13.1/lib/docsify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4.13.1/lib/plugins/search.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4.13.1/lib/plugins/zoom-image.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked@4.3.0/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-katex@1.4.5/dist/docsify-katex.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-count@1.1.0/dist/countable.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-python.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-copy-code@2.1.1/dist/docsify-copy-code.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-plugin-toc@1.3.1/dist/docsify-plugin-toc.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-plugin-flexible-alerts@1.1.1/dist/docsify-plugin-flexible-alerts.min.js"></script>
</body>
</html>
